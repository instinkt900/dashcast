services:
  dashcast:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dashcast:latest
    container_name: dashcast
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Set DASHCAST_HA_TOKEN in docker/.env (see .env.example). Never commit it.
      - DASHCAST_HA_TOKEN=${DASHCAST_HA_TOKEN:?set DASHCAST_HA_TOKEN in docker/.env}
    volumes:
      - ./config.toml:/app/config.toml:ro
      - dashcast-data:/data
    # Chromium can be memory-hungry; give it room and a healthcheck.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  dashcast-data:
